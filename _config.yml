# Jekyll configuration for GitHub Pages
title: Greylock Placement Services - Expert Vocational Evaluation & Rehabilitation Services
description: Leading vocational experts providing comprehensive vocational evaluations, disability assessments, expert witness testimony, and career counseling services. Serving legal professionals, insurance companies, and individuals nationwide.
url: "https://cskerritt.github.io"
baseurl: "/gps-website"

# SEO and Social
author: Greylock Placement Services LLC
twitter:
  username: 
  card: summary_large_image
social:
  name: Greylock Placement Services LLC
  links:
    - https://www.g-p-s.org/

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      image: "/assets/images/default-og-image.jpg"