<!-- Organization Schema -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "{{ site.title }}",
    "alternateName": "G-P-S",
    "url": "{{ site.url }}{{ site.baseurl }}",
    "description": "{{ site.description }}",
    "sameAs": {{ site.social.links | jsonify }},
    "address": {
        "@type": "PostalAddress",
        "addressCountry": "US"
    }
}
</script>

<!-- WebSite Schema -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}{{ site.baseurl }}",
    "description": "{{ site.description }}",
    "potentialAction": {
        "@type": "SearchAction",
        "target": "{{ site.url }}{{ site.baseurl }}/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
    }
}
</script>

<!-- Service Schema -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Service",
    "provider": {
        "@type": "Organization",
        "name": "{{ site.title }}"
    },
    "serviceType": "Disability Placement Services",
    "description": "Navigating disability services and providing professional placement support",
    "areaServed": {
        "@type": "Country",
        "name": "United States"
    }
}
</script>

<!-- BreadcrumbList Schema -->
{% if page.url != "/" %}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "{{ site.url }}{{ site.baseurl }}/"
        }
        {% if page.title %},
        {
            "@type": "ListItem",
            "position": 2,
            "name": "{{ page.title }}",
            "item": "{{ page.url | absolute_url }}"
        }
        {% endif %}
    ]
}
</script>
{% endif %}
